# Continuous integration.
#
#   checks     every push and pull request: backend lint + tests, frontend lint + types (free)
#   eval-gate  answers the CI questions against eval/ci_corpus with real models and fails
#              if correctness drops. Costs ~$0.05 per run, so it runs only when asked:
#              - a pull request with the label "run-eval", or
#              - "Run workflow" on the Actions tab
#              Needs repository secrets ANTHROPIC_API_KEY and OPENAI_API_KEY.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  eval-gate:
    needs: backend
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SECRET_KEY: ci-only-not-secret
      API_INGEST_WORKER: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache the reranker model (~2.3 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-reranker-v2-m3
      - run: uv sync
      - name: Create tables, storage and index
        run: |
          uv run python -m scripts.init_db
          uv run python -m scripts.init_storage
          uv run python -m scripts.init_index
      - name: Ingest the CI corpus
        run: uv run python -m scripts.ingest ../eval/ci_corpus
      - name: Eval gate
        run: uv run python -m eval.run_eval --tag ci --name ci --min-correct 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
