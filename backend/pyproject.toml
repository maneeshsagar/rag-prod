[project]
name = "rag-backend"
version = "0.1.0"
description = "Backend for the production RAG system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "qdrant-client>=1.20",
    "boto3>=1.35",
    "anthropic>=2.14.0",
    "openai>=3.59.0",
    "tiktoken>=0.14.0",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "fastembed>=0.9.1",
    "sentence-transformers>=6.3.0",
    "python-multipart>=0.0.34",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",  # needed by FastAPI TestClient
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
